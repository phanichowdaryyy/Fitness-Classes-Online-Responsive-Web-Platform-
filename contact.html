<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('https://images.pexels.com/photos/841130/pexels-photo-841130.jpeg?cs=srgb&dl=pexels-victorfreitas-841130.jpg&fm=jpg') no-repeat center center/cover;
            position: relative;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(75, 75, 63, 0.7); /* Low opacity overlay */
        }

        .contact-container {
            position: relative;
            background: #5B5C55;
            color: #E6E5C9;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        .contact-container h2 {
            margin-bottom: 10px;
            color: #F6F9F9;
        }

        .contact-container p {
            font-size: 18px;
            margin: 5px 0;
        }

        .contact-container a {
            color: #E6E5C9;
            text-decoration: none;
            font-weight: bold;
        }

        .contact-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="contact-container">
        <h2>Contact Details</h2>
        <p>Phone: 8125983668</p>
        <p>Email: <a href="mailto:phani.chowdaryyy@gmail.com">phani.chowdaryyy@gmail.com</a></p>
    </div>
</body>
</html>
