<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: url('https://i.ibb.co/NgLfNnWB/360-F-809482598-i-FY3-RUs-AXrpa-JAu-Fh2-Uij-Lu-Lh-GMQYJDb-2.jpg') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 27, 42, 0.7);
        }
        .container {
            display: flex;
            width: 800px;
            background: #e0e1dd;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .image-section {
            width: 50%;
            background: url('https://i.ibb.co/1t36rSNS/d3e4b7244abd48bb2b0752cc1e9a5653.jpg') no-repeat center center/cover;
        }
        .login-container {
            width: 50%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1b263b;
        }
        .login-container h2 {
            color: #e0e1dd;
            margin-bottom: 20px;
        }
        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #415a77;
            color: white;
            outline: none;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background: #778da9;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .login-container button:hover {
            background: #415a77;
        }
    </style>
    <script>
        function redirectToHome() {
            // Redirect to home.html
            window.location.href = "home.html";
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="image-section"></div>
        <div class="login-container">
            <h2>Login</h2>
            <input type="text" placeholder="Username" id="username">
            <input type="password" placeholder="Password" id="password">
            <button onclick="redirectToHome()">Login</button>
        </div>
    </div>
</body>
</html>
