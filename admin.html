<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page - Fitness Streaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: url('https://i.ibb.co/LzYrSsKB/360-F-179817756-Qz-Tocli57q9-G6a1-Oe7k-Jto-MS5d-NMU8cl.jpg') no-repeat center center/cover;
            height: 100vh;
            position: relative;
        }
        
        /* Overlay to reduce opacity */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Dark overlay */
            z-index: -1;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            color: white;
        }
        .navbar .logo {
            font-size: 24px;
            font-weight: bold;
        }
        .navbar .menu a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }
        .navbar .menu a:hover {
            text-decoration: underline;
        }
        
        .content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
            text-align: center;
        }
        .content h1 {
            color: white;
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .upload-section {
            display: flex;
            gap: 20px;
        }
        .upload-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }
        .upload-box input, .upload-box button {
            margin-top: 10px;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .upload-box button {
            background: #ff9800;
            color: white;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">Fitness Journey</div>
        <nav class="menu">
            <a href="#home">Home</a>
            <a href="#classes">Classes</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    
    <section class="content">
        <h1>Admin Dashboard</h1>
        <div class="upload-section">
            <div class="upload-box">
                <h2>Upload Classes</h2>
                <input type="file" accept="video/*">
                <button>Upload</button>
            </div>
            <div class="upload-box">
                <h2>Upload Gallery</h2>
                <input type="file" id="galleryUpload" accept="image/*">
                <button onclick="uploadImage()">Upload</button>
            </div>
        </div>
    </section>
    
    <script>
        function uploadImage() {
            const fileInput = document.getElementById("galleryUpload");
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(event) {
                    localStorage.setItem("uploadedImage", event.target.result);
                    alert("Image uploaded successfully!");
                };
                reader.readAsDataURL(file);
            } else {
                alert("Please select an image to upload.");
            }
        }
    </script>
</body>
</html>
